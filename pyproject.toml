[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alf"
version = "3.1.3"
description = "Adaptive Landscape Flattening scripts for Multisite lambda Dynamics"
readme = "README.md"
license = "MIT"
requires-python = ">=2.7"
authors = [
    { name = "Ryan Lee Hayes", email = "rlhayes100@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "MDAnalysis",
]

[project.urls]
Homepage = "https://github.com/ryanleehayes/alf"

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
alf = ["default_scripts/*"]
